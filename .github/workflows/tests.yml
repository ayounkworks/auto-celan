name: CLI checks

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI dependencies and test runner
        run: python -m pip install -r requirements.txt pytest
      - name: Compile CLI runtime
        run: python -m compileall -q main.py local_runner.py core
      - name: Run CLI tests
        run: python -m pytest -q test/test_local_cli.py test/test_cli_parser.py test/test_runpod_payload.py
